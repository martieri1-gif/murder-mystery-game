<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Murder Mystery - Among Us Style</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font: 14px sans-serif; background: #1a1a2e; color: #fff; overflow: hidden; }
canvas { display: block; background: linear-gradient(135deg, #0f3460 0%, #16213e 100%); }
#ui { position: fixed; top: 0; left: 0; right: 0; padding: 15px; display: flex; justify-content: space-between; font-size: 18px; z-index: 10; }
#info { flex: 1; }
#controls { text-align: right; }
button { padding: 10px 20px; background: #e94560; color: #fff; border: 0; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; }
button:hover { background: #d63447; }
#status { margin-top: 10px; font-size: 14px; }
</style>
</head>
<body>

<div id="ui">
  <div id="info">
    <div>🕹️ <strong id="roleText">Loading...</strong></div>
    <div id="status" style="font-size: 12px; margin-top: 5px; color: #aaa;"></div>
  </div>
  <div id="controls">
    <button id="startBtn">Start Game</button>
  </div>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight - 60;

const COLORS = ['#ff6b6b', '#4ecdc4', '#ffe66d', '#5d9cec', '#a78bfa', '#ff9f43', '#7bd389', '#f06595'];
const SPEED = 2;
const PLAYER_SIZE = 20;
const KILL_DISTANCE = 30;
const VISION_RANGE = 150;

let gameState = {
  running: false,
  gameMode: 'lobby', // lobby, playing, discussion, gameOver
  players: [],
  killer: null,
  killCooldown: 0,
  discussionTime: 0,
  localPlayer: null
};

class Player {
  constructor(id, name, x, y, color, isBot = false) {
    this.id = id;
    this.name = name;
    this.x = x;
    this.y = y;
    this.color = color;
    this.isBot = isBot;
    this.isKiller = false;
    this.isDead = false;
    this.vx = 0;
    this.vy = 0;
    this.targetX = x;
    this.targetY = y;
  }

  update() {
    if (this.isDead) return;

    if (this.isBot && !this.isKiller) {
      // Bot AI - wander randomly
      if (Math.random() < 0.02) {
        this.targetX = Math.random() * canvas.width;
        this.targetY = Math.random() * canvas.height;
      }
    } else if (this.isKiller && this.isBot) {
      // Killer bot AI - hunt nearest player
      let nearest = null;
      let minDist = Infinity;
      gameState.players.forEach(p => {
        if (!p.isDead && !p.isKiller) {
          const dist = Math.hypot(p.x - this.x, p.y - this.y);
          if (dist < minDist) {
            minDist = dist;
            nearest = p;
          }
        }
      });
      if (nearest) {
        this.targetX = nearest.x;
        this.targetY = nearest.y;
      }
    }

    // Move toward target
    const dx = this.targetX - this.x;
    const dy = this.targetY - this.y;
    const dist = Math.hypot(dx, dy);

    if (dist > 5) {
      this.x += (dx / dist) * SPEED;
      this.y += (dy / dist) * SPEED;
    }

    // Bounds
    this.x = Math.max(PLAYER_SIZE, Math.min(canvas.width - PLAYER_SIZE, this.x));
    this.y = Math.max(PLAYER_SIZE, Math.min(canvas.height - PLAYER_SIZE, this.y));
  }

  draw() {
    if (this.isDead) {
      ctx.fillStyle = '#333';
      ctx.globalAlpha = 0.4;
    } else {
      ctx.fillStyle = this.color;
      ctx.globalAlpha = 1;
    }

    // Body
    ctx.beginPath();
    ctx.ellipse(this.x, this.y + 2, PLAYER_SIZE - 3, PLAYER_SIZE, 0, 0, Math.PI * 2);
    ctx.fill();

    // Head
    ctx.beginPath();
    ctx.arc(this.x, this.y - 8, PLAYER_SIZE - 5, 0, Math.PI * 2);
    ctx.fill();

    // Eyes
    if (!this.isDead) {
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(this.x - 5, this.y - 10, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(this.x + 5, this.y - 10, 3, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(this.x - 5, this.y - 10, 1.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(this.x + 5, this.y - 10, 1.5, 0, Math.PI * 2);
      ctx.fill();
    }

    // Killer indicator
    if (this.isKiller) {
      ctx.strokeStyle = '#ff3333';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(this.x, this.y, PLAYER_SIZE + 5, 0, Math.PI * 2);
      ctx.stroke();
      // Draw knife
      ctx.strokeStyle = '#ff3333';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(this.x + 15, this.y - 15);
      ctx.lineTo(this.x + 25, this.y - 25);
      ctx.stroke();
    }

    ctx.globalAlpha = 1;

    // Name
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(this.name, this.x, this.y + 25);
  }

  kill() {
    this.isDead = true;
  }
}

function init() {
  gameState.players = [];
  gameState.gameMode = 'playing';
  gameState.killCooldown = 0;

  // Create local player
  const playerColor = COLORS[0];
  const localPlayer = new Player('player1', 'You', 100, 100, playerColor, false);
  gameState.players.push(localPlayer);
  gameState.localPlayer = localPlayer;

  // Create killer
  const killer = new Player('killer', '🔪 Killer', 400, 200, '#e74c3c', true);
  killer.isKiller = true;
  gameState.players.push(killer);
  gameState.killer = killer;

  // Create bots
  const botNames = ['Red', 'Blue', 'Yellow', 'Green', 'Purple', 'Orange', 'Pink', 'Cyan'];
  for (let i = 0; i < 7; i++) {
    const bot = new Player('bot' + i, botNames[i], Math.random() * canvas.width, Math.random() * canvas.height, COLORS[i + 1], true);
    gameState.players.push(bot);
  }

  gameState.running = true;
  updateUI();
}

function handleKeyDown(e) {
  if (!gameState.localPlayer) return;

  const speed = 5;
  switch(e.key.toLowerCase()) {
    case 'w': gameState.localPlayer.targetY -= speed * 10; break;
    case 'a': gameState.localPlayer.targetX -= speed * 10; break;
    case 's': gameState.localPlayer.targetY += speed * 10; break;
    case 'd': gameState.localPlayer.targetX += speed * 10; break;
  }
}

function update() {
  if (!gameState.running) return;

  // Update all players
  gameState.players.forEach(p => p.update());

  // Killer tries to kill nearby players
  if (gameState.killer && gameState.killCooldown <= 0) {
    gameState.players.forEach(p => {
      if (!p.isDead && !p.isKiller) {
        const dist = Math.hypot(p.x - gameState.killer.x, p.y - gameState.killer.y);
        if (dist < KILL_DISTANCE) {
          p.kill();
          gameState.killCooldown = 120; // 2 seconds cooldown
        }
      }
    });
  }

  gameState.killCooldown--;

  // Check win conditions
  const alivePlayers = gameState.players.filter(p => !p.isDead && !p.isKiller);
  if (alivePlayers.length === 0) {
    gameState.gameMode = 'gameOver';
    gameState.running = false;
  }
}

function draw() {
  ctx.fillStyle = '#0f3460';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Draw grid
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
  ctx.lineWidth = 1;
  for (let i = 0; i < canvas.width; i += 50) {
    ctx.beginPath();
    ctx.moveTo(i, 0);
    ctx.lineTo(i, canvas.height);
    ctx.stroke();
  }
  for (let i = 0; i < canvas.height; i += 50) {
    ctx.beginPath();
    ctx.moveTo(0, i);
    ctx.lineTo(canvas.width, i);
    ctx.stroke();
  }

  // Draw players
  gameState.players.forEach(p => p.draw());

  // Draw dead body markers
  gameState.players.forEach(p => {
    if (p.isDead) {
      ctx.fillStyle = 'rgba(255, 0, 0, 0.3)';
      ctx.beginPath();
      ctx.arc(p.x, p.y, 25, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ff6b6b';
      ctx.font = 'bold 16px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('💀', p.x, p.y);
    }
  });
}

function updateUI() {
  const alivePlayers = gameState.players.filter(p => !p.isDead);
  const deadPlayers = gameState.players.filter(p => p.isDead);
  const alive = alivePlayers.filter(p => !p.isKiller).length;

  document.getElementById('roleText').textContent = `Crewmate - Alive: ${alive} | Dead: ${deadPlayers.length}`;
  document.getElementById('status').textContent = `Use WASD to move | Avoid the 🔪 Killer!`;

  if (gameState.gameMode === 'gameOver') {
    document.getElementById('roleText').textContent = gameState.localPlayer.isDead ? '💀 You were killed!' : '🎉 Survivors won!';
  }
}

function gameLoop() {
  update();
  draw();
  updateUI();
  requestAnimationFrame(gameLoop);
}

// Controls
document.getElementById('startBtn').onclick = init;
document.addEventListener('keydown', handleKeyDown);
window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight - 60;
});

gameLoop();
</script>

</body>
</html>
